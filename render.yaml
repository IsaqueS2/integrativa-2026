services:
  - type: web
    name: confeitaria
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedHosts
        value: "*"
      - key: ConnectionStrings__Database
        sync: false
      - key: Database__Provider
        value: Postgres
      - key: SeedDemo
        value: "false"
